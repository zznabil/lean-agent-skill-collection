name: Apply V8.4.0 proof-integrity update

on:
  push:
    branches:
      - release/v8.4.0-proof-integrity
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-v8.4.0-proof-integrity
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out release branch with history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: release/v8.4.0-proof-integrity
          fetch-depth: 0
          persist-credentials: true

      - name: Apply reviewed V8.4.0 update
        shell: bash
        run: python .github/apply-v8.4.0.py

      - name: Remove temporary update scaffolding
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/apply-v8.4.0.py .github/workflows/apply-v8.4.0.yml
          git add -A
          git diff --cached --check

      - name: Build twice and prove deterministic output
        shell: pwsh
        run: |
          ./scripts/build-release.ps1 -OutputDirectory ./artifacts/repro-a
          ./scripts/build-release.ps1 -OutputDirectory ./artifacts/repro-b
          $files = @(Get-ChildItem ./artifacts/repro-a -File | Sort-Object Name)
          $otherFiles = @(Get-ChildItem ./artifacts/repro-b -File | Sort-Object Name)
          if ($files.Count -ne $otherFiles.Count) { throw 'Build output file counts differ' }
          foreach ($file in $files) {
            $other = Join-Path ./artifacts/repro-b $file.Name
            if (-not (Test-Path -LiteralPath $other)) { throw "Second build lacks $($file.Name)" }
            if ((Get-FileHash $file.FullName).Hash -ne (Get-FileHash $other).Hash) {
              throw "Non-deterministic output: $($file.Name)"
            }
          }

      - name: Test validator rejection controls
        shell: pwsh
        run: ./scripts/test-validator.ps1

      - name: Validate source and release artifacts
        shell: pwsh
        run: ./scripts/validate.ps1 -ArtifactsDirectory ./artifacts/repro-a

      - name: Audit repository and proof-integrity contracts
        shell: pwsh
        run: ./scripts/audit-repository.ps1 -ArtifactsDirectory ./artifacts/repro-a

      - name: Verify proof-integrity scenario corpus
        shell: python
        run: |
          import csv
          from pathlib import Path

          path = Path('docs/evals/proof-integrity-scenarios-v8.4.0.csv')
          rows = list(csv.DictReader(path.open(encoding='utf-8', newline='')))
          if len(rows) != 40:
              raise SystemExit(f'expected 40 scenarios, found {len(rows)}')
          if len({row['id'] for row in rows}) != 40:
              raise SystemExit('scenario ids are not unique')
          print('proof-integrity scenarios: 40 unique rows')

      - name: Commit validated V8.4.0 source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git status --short
          git commit -m "feat: add proof integrity and verified orchestration"
          git push origin HEAD:release/v8.4.0-proof-integrity
