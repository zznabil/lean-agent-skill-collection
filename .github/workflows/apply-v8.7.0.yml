name: Apply V8.7.0 direct claims

on:
  push:
    branches:
      - release/v8.7.0-direct-claims
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-v8.7.0-direct-claims
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out candidate with history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: release/v8.7.0-direct-claims
          fetch-depth: 0
          persist-credentials: true

      - name: Apply source update with historical references preserved
        shell: python
        run: |
          from pathlib import Path
          path = Path('.github/apply-v8.7.0.py')
          source = path.read_text(encoding='utf-8')
          anchor = 'readme = read("README.md").replace("v8.6.0", "v8.7.0").replace("V8.6.0", "V8.7.0")'
          replacement = anchor + '\nreadme = readme.replace("docs/HERMES-PROMPT-REVIEW-v8.7.0.md", "docs/HERMES-PROMPT-REVIEW-v8.6.0.md").replace("It adds outcome-first communication", "It preserves outcome-first communication")'
          if source.count(anchor) != 1:
              raise SystemExit('Historical-reference patch anchor drifted')
          source = source.replace(anchor, replacement, 1)
          compile(source, str(path), 'exec')
          exec(compile(source, str(path), 'exec'))

      - name: Remove only temporary candidate scaffolding
        shell: bash
        run: |
          set -euo pipefail
          git rm -f .github/apply-v8.7.0.py .github/workflows/apply-v8.7.0.yml
          git add -A
          git diff --cached --check

      - name: Verify unchanged routing and package inventories
        shell: python
        run: |
          import json
          import subprocess
          from pathlib import Path
          base = 'fbc30ccb81072c9d112400523884de309bde26bd'
          old = json.loads(subprocess.check_output(['git', 'show', base + ':release-profiles.json'], text=True))
          new = json.loads(Path('release-profiles.json').read_text(encoding='utf-8'))
          if old['profiles'] != new['profiles'] or new['version'] != '8.7.0':
              raise SystemExit('Profile membership or release version differs from the approved contract')
          for path in sorted(Path('skills').glob('*/agents/openai.yaml')):
              before = subprocess.check_output(['git', 'show', base + ':' + path.as_posix()], text=True)
              after = path.read_text(encoding='utf-8')
              if before.split('\npolicy:\n', 1)[1] != after.split('\npolicy:\n', 1)[1]:
                  raise SystemExit(f'Invocation policy changed: {path}')
          print('23 skill adapters retain their original invocation policies; all 6 profiles retain their inventories.')

      - name: Build twice and compare bytes
        shell: pwsh
        run: |
          ./scripts/build-release.ps1 -OutputDirectory ./artifacts/repro-a
          ./scripts/build-release.ps1 -OutputDirectory ./artifacts/repro-b
          $first = @(Get-ChildItem ./artifacts/repro-a -File | Sort-Object Name)
          $second = @(Get-ChildItem ./artifacts/repro-b -File | Sort-Object Name)
          if ($first.Count -ne $second.Count) { throw 'Build output counts differ' }
          foreach ($file in $first) {
            $other = Join-Path ./artifacts/repro-b $file.Name
            if (-not (Test-Path -LiteralPath $other)) { throw "Missing second output: $($file.Name)" }
            if ((Get-FileHash $file.FullName).Hash -ne (Get-FileHash $other).Hash) { throw "Non-deterministic output: $($file.Name)" }
          }

      - name: Test rejection and direct-claims mutation controls
        shell: pwsh
        run: ./scripts/test-validator.ps1

      - name: Validate source and actual package policy contents
        shell: pwsh
        run: ./scripts/validate.ps1 -ArtifactsDirectory ./artifacts/repro-a

      - name: Audit repository and authored fixture integrity
        shell: pwsh
        run: ./scripts/audit-repository.ps1 -ArtifactsDirectory ./artifacts/repro-a

      - name: Commit validated source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --stat
          git commit -m "feat: add direct claims and accountable reporting"
          git push origin HEAD:release/v8.7.0-direct-claims
