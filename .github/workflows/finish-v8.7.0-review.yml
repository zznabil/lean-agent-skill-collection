name: Finish V8.7.0 validator review
on:
  push:
    branches:
      - release/v8.7.0-direct-claims
permissions:
  contents: write
concurrency:
  group: finish-v8.7.0-review
  cancel-in-progress: false
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: release/v8.7.0-direct-claims
          fetch-depth: 0
          persist-credentials: true
      - name: Make group summaries reflect direct-claims failures
        shell: python
        run: |
          from pathlib import Path
          import hashlib
          import re
          path = Path('scripts/validate.ps1')
          text = path.read_text(encoding='utf-8')
          patches = [
              ("CITATION|PACKAGE-VALIDATION|LICENSE|metadata parse'", "CITATION|PACKAGE-VALIDATION|LICENSE|metadata parse|direct-claims'"),
              ("proportional-rigor|outcome-first delivery'", "proportional-rigor|outcome-first delivery|direct-claims'"),
              ("    $declared=@{}", "    if ($manifest.direct_claims -ne $true) { Add-Failure 'release manifest direct-claims flag missing' }\n    $declared=@{}"),
          ]
          for old, new in patches:
              if text.count(old) != 1:
                  raise SystemExit(f'Validator patch anchor drifted: {old}')
              text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8', newline='\n')
          manifest = Path('UPSTREAM-CHECKSUMS.sha256')
          lines = []
          for line in manifest.read_text(encoding='utf-8').splitlines():
              match = re.fullmatch(r'[0-9a-fA-F]{64}\s+(.+)', line)
              if not match:
                  raise SystemExit('Invalid checksum record')
              relative = match.group(1)
              lines.append(hashlib.sha256(Path(relative).read_bytes()).hexdigest() + '  ' + relative)
          manifest.write_text('\n'.join(lines) + '\n', encoding='utf-8', newline='\n')
      - name: Remove repair scaffold
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/finish-v8.7.0-review.yml
          git add -A
          git diff --cached --check
      - name: Verify repaired validator and packages
        shell: pwsh
        run: |
          ./scripts/build-release.ps1 -OutputDirectory ./artifacts/repaired
          ./scripts/test-validator.ps1
          ./scripts/validate.ps1 -ArtifactsDirectory ./artifacts/repaired
          ./scripts/audit-repository.ps1 -ArtifactsDirectory ./artifacts/repaired
      - name: Commit reviewed source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: report direct-claims validation failures accurately"
          git push origin HEAD:release/v8.7.0-direct-claims
