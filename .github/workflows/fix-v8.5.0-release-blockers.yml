name: Fix V8.5.0 release blockers

on:
  push:
    branches:
      - fix/v8.5.0-release-blockers
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fix-v8.5.0-release-blockers
  cancel-in-progress: false

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repair branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/v8.5.0-release-blockers
          fetch-depth: 0
          persist-credentials: true

      - name: Remove Unicode parser hazard from validation source
        shell: python
        run: |
          from pathlib import Path

          path = Path('scripts/validate.ps1')
          text = path.read_text(encoding='utf-8')
          old = "'correctness → safety'"
          new = "('correctness ' + [char]0x2192 + ' safety')"
          count = text.count(old)
          if count == 2:
              path.write_text(text.replace(old, new), encoding='utf-8', newline='\n')
              print('Replaced both non-ASCII parser-sensitive literals.')
          elif count == 0 and text.count(new) == 2:
              print('Parser repair is already present.')
          else:
              raise SystemExit(f'Unexpected validation-source state: old={count}, new={text.count(new)}')

      - name: Validate repaired source on PowerShell 7
        shell: pwsh
        run: |
          ./scripts/build-release.ps1 -OutputDirectory ./artifacts/repaired
          ./scripts/test-validator.ps1
          ./scripts/validate.ps1 -ArtifactsDirectory ./artifacts/repaired
          ./scripts/audit-repository.ps1 -ArtifactsDirectory ./artifacts/repaired

      - name: Commit repair when needed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- scripts/validate.ps1; then
            echo "No source repair remains to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/validate.ps1
          git commit -m "fix: make proportional-rigor validation PowerShell 5.1 safe"
          git push origin HEAD:fix/v8.5.0-release-blockers
