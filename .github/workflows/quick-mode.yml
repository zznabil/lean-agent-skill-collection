name: Validate Quick Mode

on:
  push:
    branches: [feat/quick-mode-skill]
    paths:
      - '.codex-plugin/plugin.json'
      - '.github/workflows/quick-mode.yml'
      - 'CHANGELOG.md'
      - 'CITATION.cff'
      - 'PACKAGE-VALIDATION.json'
      - 'README.md'
      - 'UPSTREAM-CHECKSUMS.sha256'
      - 'docs/AUDIT.md'
      - 'docs/QUICK-MODE-DESIGN-v8.10.0.md'
      - 'docs/REPOSITORY-AUDIT.md'
      - 'docs/SKILL-CATALOG.md'
      - 'docs/evals/quick-mode-scenarios-v8.10.0.csv'
      - 'release-profiles.json'
      - 'releases/v8.10.0/**'
      - 'scripts/**'
      - 'skills/quick-mode/**'
  pull_request:
    branches: [main]
    paths:
      - '.codex-plugin/plugin.json'
      - '.github/workflows/quick-mode.yml'
      - 'CHANGELOG.md'
      - 'CITATION.cff'
      - 'PACKAGE-VALIDATION.json'
      - 'README.md'
      - 'UPSTREAM-CHECKSUMS.sha256'
      - 'docs/AUDIT.md'
      - 'docs/QUICK-MODE-DESIGN-v8.10.0.md'
      - 'docs/REPOSITORY-AUDIT.md'
      - 'docs/SKILL-CATALOG.md'
      - 'docs/evals/quick-mode-scenarios-v8.10.0.csv'
      - 'release-profiles.json'
      - 'releases/v8.10.0/**'
      - 'scripts/**'
      - 'skills/quick-mode/**'

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: '1'
  PYTHONUTF8: '1'

jobs:
  validate-pwsh:
    name: Quick Mode contract (PowerShell 7)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Build twice and prove reproducibility
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          ./scripts/build-release.ps1 -OutputDirectory ./artifacts/repro-a
          ./scripts/build-release.ps1 -OutputDirectory ./artifacts/repro-b
          ./scripts/compare-release-artifacts.ps1 -ReferenceDirectory ./artifacts/repro-a -CandidateDirectory ./artifacts/repro-b
          $negativeRoot = Join-Path ([IO.Path]::GetTempPath()) ('quick-mode-hash-negative-' + [Guid]::NewGuid().ToString('N'))
          New-Item -ItemType Directory -Path (Join-Path $negativeRoot 'a') -Force | Out-Null
          New-Item -ItemType Directory -Path (Join-Path $negativeRoot 'b') -Force | Out-Null
          try {
            [IO.File]::WriteAllBytes((Join-Path $negativeRoot 'a/same.zip'), [byte[]](0x41))
            [IO.File]::WriteAllBytes((Join-Path $negativeRoot 'b/same.zip'), [byte[]](0x42))
            $previousErrorActionPreference = $ErrorActionPreference
            $ErrorActionPreference = 'Continue'
            $oneByteOutput = @(& pwsh -NoLogo -NoProfile -File ./scripts/compare-release-artifacts.ps1 -ReferenceDirectory (Join-Path $negativeRoot 'a') -CandidateDirectory (Join-Path $negativeRoot 'b') 2>&1)
            $oneByteExitCode = $LASTEXITCODE
            $ErrorActionPreference = $previousErrorActionPreference
            if ($oneByteExitCode -eq 0) { throw 'Child reproducibility comparison failed to reject a one-byte difference' }
          }
          finally { Remove-Item -LiteralPath $negativeRoot -Recurse -Force -ErrorAction SilentlyContinue }
          $hiddenRoot = Join-Path ([IO.Path]::GetTempPath()) ('quick-mode-hidden-negative-' + [Guid]::NewGuid().ToString('N'))
          New-Item -ItemType Directory -Path (Join-Path $hiddenRoot 'a') -Force | Out-Null
          New-Item -ItemType Directory -Path (Join-Path $hiddenRoot 'b') -Force | Out-Null
          try {
            [IO.File]::WriteAllBytes((Join-Path $hiddenRoot 'a/same.zip'), [byte[]](0x41))
            [IO.File]::WriteAllBytes((Join-Path $hiddenRoot 'b/same.zip'), [byte[]](0x41))
            $hiddenExtra = Join-Path $hiddenRoot 'b/.hidden-extra.zip'
            [IO.File]::WriteAllBytes($hiddenExtra, [byte[]](0x41))
            [IO.File]::SetAttributes($hiddenExtra, [IO.FileAttributes]::Hidden)
            $previousErrorActionPreference = $ErrorActionPreference
            $ErrorActionPreference = 'Continue'
            $hiddenProcess = Start-Process -FilePath pwsh -ArgumentList @('-NoLogo', '-NoProfile', '-File', './scripts/compare-release-artifacts.ps1', '-ReferenceDirectory', (Join-Path $hiddenRoot 'a'), '-CandidateDirectory', (Join-Path $hiddenRoot 'b')) -Wait -PassThru
            $hiddenExitCode = $hiddenProcess.ExitCode
            $ErrorActionPreference = $previousErrorActionPreference
            if ($hiddenExitCode -eq 0) { throw 'Child reproducibility comparison failed to reject a hidden extra file' }
            $global:LASTEXITCODE = 0
          }
          finally { Remove-Item -LiteralPath $hiddenRoot -Recurse -Force -ErrorAction SilentlyContinue }
      - name: Test validator rejection controls
        shell: pwsh
        run: ./scripts/test-validator.ps1
      - name: Validate source and release artifacts
        shell: pwsh
        run: ./scripts/validate.ps1 -ArtifactsDirectory ./artifacts/repro-a
      - name: Audit repository integrity
        shell: pwsh
        run: ./scripts/audit-repository.ps1 -ArtifactsDirectory ./artifacts/repro-a
      - name: Verify prose preservation and packaged standalone instructions
        shell: pwsh
        run: ./scripts/test-prose-preservation.ps1 -ArtifactsDirectory ./artifacts/repro-a

  validate-windows-powershell:
    name: Quick Mode contract (Windows PowerShell 5.1)
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Build twice and prove reproducibility
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          ./scripts/build-release.ps1 -OutputDirectory ./artifacts/repro-a
          ./scripts/build-release.ps1 -OutputDirectory ./artifacts/repro-b
          ./scripts/compare-release-artifacts.ps1 -ReferenceDirectory ./artifacts/repro-a -CandidateDirectory ./artifacts/repro-b
          $negativeRoot = Join-Path ([IO.Path]::GetTempPath()) ('quick-mode-hash-negative-' + [Guid]::NewGuid().ToString('N'))
          New-Item -ItemType Directory -Path (Join-Path $negativeRoot 'a') -Force | Out-Null
          New-Item -ItemType Directory -Path (Join-Path $negativeRoot 'b') -Force | Out-Null
          try {
            [IO.File]::WriteAllBytes((Join-Path $negativeRoot 'a/same.zip'), [byte[]](0x41))
            [IO.File]::WriteAllBytes((Join-Path $negativeRoot 'b/same.zip'), [byte[]](0x42))
            $previousErrorActionPreference = $ErrorActionPreference
            $ErrorActionPreference = 'Continue'
            $oneByteOutput = @(& powershell.exe -NoLogo -NoProfile -File ./scripts/compare-release-artifacts.ps1 -ReferenceDirectory (Join-Path $negativeRoot 'a') -CandidateDirectory (Join-Path $negativeRoot 'b') 2>&1)
            $oneByteExitCode = $LASTEXITCODE
            $ErrorActionPreference = $previousErrorActionPreference
            if ($oneByteExitCode -eq 0) { throw 'Child reproducibility comparison failed to reject a one-byte difference' }
          }
          finally { Remove-Item -LiteralPath $negativeRoot -Recurse -Force -ErrorAction SilentlyContinue }
          $hiddenRoot = Join-Path ([IO.Path]::GetTempPath()) ('quick-mode-hidden-negative-' + [Guid]::NewGuid().ToString('N'))
          New-Item -ItemType Directory -Path (Join-Path $hiddenRoot 'a') -Force | Out-Null
          New-Item -ItemType Directory -Path (Join-Path $hiddenRoot 'b') -Force | Out-Null
          try {
            [IO.File]::WriteAllBytes((Join-Path $hiddenRoot 'a/same.zip'), [byte[]](0x41))
            [IO.File]::WriteAllBytes((Join-Path $hiddenRoot 'b/same.zip'), [byte[]](0x41))
            $hiddenExtra = Join-Path $hiddenRoot 'b/.hidden-extra.zip'
            [IO.File]::WriteAllBytes($hiddenExtra, [byte[]](0x41))
            [IO.File]::SetAttributes($hiddenExtra, [IO.FileAttributes]::Hidden)
            $previousErrorActionPreference = $ErrorActionPreference
            $ErrorActionPreference = 'Continue'
            $hiddenProcess = Start-Process -FilePath powershell.exe -ArgumentList @('-NoLogo', '-NoProfile', '-File', './scripts/compare-release-artifacts.ps1', '-ReferenceDirectory', (Join-Path $hiddenRoot 'a'), '-CandidateDirectory', (Join-Path $hiddenRoot 'b')) -Wait -PassThru
            $hiddenExitCode = $hiddenProcess.ExitCode
            $ErrorActionPreference = $previousErrorActionPreference
            if ($hiddenExitCode -eq 0) { throw 'Child reproducibility comparison failed to reject a hidden extra file' }
            $global:LASTEXITCODE = 0
          }
          finally { Remove-Item -LiteralPath $hiddenRoot -Recurse -Force -ErrorAction SilentlyContinue }
      - name: Test validator rejection controls
        shell: powershell
        run: ./scripts/test-validator.ps1
      - name: Validate source and release artifacts
        shell: powershell
        run: ./scripts/validate.ps1 -ArtifactsDirectory ./artifacts/repro-a
      - name: Audit repository integrity
        shell: powershell
        run: ./scripts/audit-repository.ps1 -ArtifactsDirectory ./artifacts/repro-a
      - name: Verify prose preservation and packaged standalone instructions
        shell: powershell
        run: ./scripts/test-prose-preservation.ps1 -ArtifactsDirectory ./artifacts/repro-a
