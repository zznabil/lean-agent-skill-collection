name: Recover complete V8.3.0 source

on:
  push:
    branches:
      - release/v8.3.0-usable-information
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: recover-v8.3.0-source
  cancel-in-progress: false

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - name: Check out proposal branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: release/v8.3.0-usable-information
          fetch-depth: 0
          persist-credentials: true

      - name: Recover reviewed source overlay from branch history
        shell: bash
        run: |
          set -euo pipefail
          source_commit=698067464fd9c116f213ebec74507529d5e0d2fc
          work="$(mktemp -d)"
          trap 'rm -rf "$work"' EXIT
          for index in $(seq -w 0 9); do
            git show "$source_commit:.github/v8.3.0-overlay.part${index}.b64" >> "$work/overlay.b64"
          done
          base64 --decode "$work/overlay.b64" > "$work/overlay.tar.xz"
          python - "$work/overlay.tar.xz" <<'PY'
          from pathlib import Path
          import sys
          import tarfile

          archive_path = Path(sys.argv[1])
          root = Path.cwd().resolve()
          with tarfile.open(archive_path, "r:xz") as archive:
              members = archive.getmembers()
              for member in members:
                  if member.issym() or member.islnk() or member.isdev():
                      raise SystemExit(f"unsafe archive member type: {member.name}")
                  target = (root / member.name).resolve()
                  if root not in target.parents and target != root:
                      raise SystemExit(f"unsafe archive path: {member.name}")
              archive.extractall(root, members=members, filter="data")
              print("Recovered files:")
              for member in members:
                  if member.isfile():
                      print(member.name)
          PY

      - name: Normalize source manifest
        shell: python
        run: |
          from hashlib import sha256
          from pathlib import Path

          root = Path.cwd()
          paths = [
              Path('.codex-plugin/plugin.json'),
              Path('AGENTS.md'),
              Path('ENGINEERING-CORE.md'),
              Path('LICENSE'),
              Path('PACKAGE-VALIDATION.json'),
              Path('README.md'),
              Path('THIRD_PARTY_NOTICES.md'),
          ]
          paths.extend(sorted(path.relative_to(root) for path in (root / 'skills').rglob('*') if path.is_file()))
          lines = []
          for relative in paths:
              data = (root / relative).read_bytes()
              lines.append(f"{sha256(data).hexdigest()}  {relative.as_posix()}")
          Path('UPSTREAM-CHECKSUMS.sha256').write_text('\n'.join(lines) + '\n', encoding='utf-8', newline='\n')

      - name: Validate recovered proposal
        shell: pwsh
        run: |
          ./scripts/build-release.ps1 -OutputDirectory ./artifacts/recovered
          ./scripts/test-validator.ps1
          ./scripts/validate.ps1 -ArtifactsDirectory ./artifacts/recovered

      - name: Commit recovered source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/recover-v8.3.0.yml
          git add -A
          git status --short
          git commit -m "fix: restore complete V8.3.0 proposal source"
          git push origin HEAD:release/v8.3.0-usable-information
