name: Refresh V8.5.1 source checksums

on:
  push:
    branches:
      - release/v8.5.1-validator-portability
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-v8.5.1-source-checksums
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out release branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: release/v8.5.1-validator-portability
          fetch-depth: 0
          persist-credentials: true

      - name: Recompute every declared source checksum
        shell: python
        run: |
          from hashlib import sha256
          from pathlib import Path
          import re

          root = Path.cwd()
          manifest = root / 'UPSTREAM-CHECKSUMS.sha256'
          output = []
          for raw in manifest.read_text(encoding='utf-8').splitlines():
              match = re.fullmatch(r'[0-9a-fA-F]{64}\s+(.+)', raw)
              if not match:
                  raise SystemExit(f'Malformed checksum line: {raw}')
              relative = match.group(1)
              target = root / relative
              if not target.is_file():
                  raise SystemExit(f'Checksum target is missing: {relative}')
              output.append(f'{sha256(target.read_bytes()).hexdigest()}  {relative}')
          manifest.write_text('\n'.join(output) + '\n', encoding='utf-8', newline='\n')

      - name: Build and validate release candidate
        shell: pwsh
        run: |
          ./scripts/build-release.ps1 -OutputDirectory ./artifacts/v8.5.1
          ./scripts/test-validator.ps1
          ./scripts/validate.ps1 -ArtifactsDirectory ./artifacts/v8.5.1
          ./scripts/audit-repository.ps1 -ArtifactsDirectory ./artifacts/v8.5.1

      - name: Commit refreshed checksum inventory
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add UPSTREAM-CHECKSUMS.sha256
          if git diff --cached --quiet; then
            echo "Checksum inventory was already current."
            exit 0
          fi
          git commit -m "chore: refresh V8.5.1 source checksums"
          git push origin HEAD:release/v8.5.1-validator-portability
