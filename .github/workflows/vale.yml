name: Vale communication lint

on:
  push:
    branches: [main]
    paths:
      - '**/*.md'
      - .vale.ini
      - .gitattributes
      - release-profiles.json
      - scripts/vale-files.py
      - scripts/test-vale.ps1
      - .github/styles/**
      - .github/workflows/vale.yml
  pull_request:
    branches: [main]
    paths:
      - '**/*.md'
      - .vale.ini
      - .gitattributes
      - release-profiles.json
      - scripts/vale-files.py
      - scripts/test-vale.ps1
      - .github/styles/**
      - .github/workflows/vale.yml

permissions:
  contents: read
  checks: write

jobs:
  vale:
    name: Vale communication lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Select live authored instructions
        id: prose
        shell: python
        run: |
          import json
          import os
          import subprocess
          import sys

          result = subprocess.check_output(
              [sys.executable, "-B", "scripts/vale-files.py"], text=True
          )
          paths = json.loads(result)
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write("files=" + json.dumps(paths) + "\n")
          print(f"Selected {len(paths)} authored Markdown files.")
      - name: Lint live authored instructions
        uses: vale-cli/vale-action@518a9136acc6e6668ce7c00d367051e0941e87ff # v3.0.0
        with:
          files: ${{ steps.prose.outputs.files }}
          version: 3.23.0
          min_alert_level: warning
          fail_on_error: true
          fail_level: error
          filter_mode: nofilter
      - name: Verify full corpus, rejection and warning controls
        shell: pwsh
        run: |
          $vale = Get-ChildItem -LiteralPath (Join-Path $env:RUNNER_TOOL_CACHE 'vale/3.23.0') -Filter vale -File -Recurse
          if (@($vale).Count -ne 1) { throw 'Expected one installed Vale executable' }
          ./scripts/test-vale.ps1 -ValePath $vale.FullName
