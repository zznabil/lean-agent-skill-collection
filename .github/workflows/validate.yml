name: Validate collection
on:
  push:
    branches:
    - main
  pull_request:
    branches:
    - main
permissions:
  contents: read
jobs:
  validate-pwsh:
    name: Validate collection (PowerShell 7)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - name: Check out repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
    - name: Calibrate workflow and build output guards
      shell: pwsh
      run: |
        ./scripts/test-workflow-gates.ps1
        ./scripts/test-build-output.ps1
    - name: Build twice and prove reproducibility
      shell: pwsh
      run: |
        ./scripts/build-release.ps1 -OutputDirectory ./artifacts/repro-a
        ./scripts/build-release.ps1 -OutputDirectory ./artifacts/repro-b
        ./scripts/compare-release-artifacts.ps1 -ReferenceDirectory ./artifacts/repro-a -CandidateDirectory ./artifacts/repro-b
        if ($LASTEXITCODE -ne 0) { throw "Release artifact comparison failed" }
    - name: Calibrate composition decision oracle
      shell: pwsh
      run: python -B scripts/evaluate-composition.py --self-test
    - name: Test Hermes installer boundaries
      shell: pwsh
      run: |
        foreach ($installer in @('install-hermes.ps1', 'packs/user-facing-standards/install-hermes.ps1', 'packs/remaining-standards/install-hermes.ps1', 'packs/controlled-execution/install-hermes.ps1')) {
          ./scripts/test-hermes-install.ps1 -Installer $installer
          if ($LASTEXITCODE -ne 0) { throw "Hermes installer boundaries failed: $installer" }
        }
    - name: Test validator rejection controls
      shell: pwsh
      run: ./scripts/test-validator.ps1 -ArtifactsDirectory ./artifacts/repro-a
    - name: Validate source and release artifacts
      shell: pwsh
      run: ./scripts/validate.ps1 -ArtifactsDirectory ./artifacts/repro-a
    - name: Audit repository integrity
      shell: pwsh
      run: ./scripts/audit-repository.ps1 -ArtifactsDirectory ./artifacts/repro-a
    - name: Validate remaining standards review pack
      shell: pwsh
      run: |
        python -B packs/remaining-standards/audit/validate_bundle.py
        if ($LASTEXITCODE -ne 0) { throw "Python gate failed: validate_bundle.py" }
        python -B packs/remaining-standards/audit/test_validate_bundle.py
        if ($LASTEXITCODE -ne 0) { throw "Python gate failed: test_validate_bundle.py" }
        python -B packs/remaining-standards/audit/test_publisher_baseline.py
        if ($LASTEXITCODE -ne 0) { throw "Python gate failed: test_publisher_baseline.py" }
        python -B packs/remaining-standards/audit/build_zip.py "$env:RUNNER_TEMP/lean-remaining-standards-a.zip"
        if ($LASTEXITCODE -ne 0) { throw "Python gate failed: build_zip.py" }
        python -B packs/remaining-standards/audit/build_zip.py "$env:RUNNER_TEMP/lean-remaining-standards-b.zip"
        if ($LASTEXITCODE -ne 0) { throw "Python gate failed: build_zip.py" }
        if ((Get-FileHash "$env:RUNNER_TEMP/lean-remaining-standards-a.zip").Hash -ne (Get-FileHash "$env:RUNNER_TEMP/lean-remaining-standards-b.zip").Hash) { throw 'Remaining standards archives are not byte-identical' }
        if (git status --porcelain) { throw 'Remaining standards validation changed the checkout' }
    - name: Validate controlled-execution review pack
      shell: pwsh
      run: |
        python -B packs/controlled-execution/audit/validate_pack.py
        if ($LASTEXITCODE -ne 0) { throw "Python gate failed: validate_pack.py" }
        python -B packs/controlled-execution/audit/test_validate_pack.py
        if ($LASTEXITCODE -ne 0) { throw "Python gate failed: test_validate_pack.py" }
        python -B packs/controlled-execution/audit/build_zip.py "$env:RUNNER_TEMP/lean-controlled-execution-a.zip"
        if ($LASTEXITCODE -ne 0) { throw "Python gate failed: build_zip.py" }
        python -B packs/controlled-execution/audit/build_zip.py "$env:RUNNER_TEMP/lean-controlled-execution-b.zip"
        if ($LASTEXITCODE -ne 0) { throw "Python gate failed: build_zip.py" }
        if ((Get-FileHash "$env:RUNNER_TEMP/lean-controlled-execution-a.zip").Hash -ne (Get-FileHash "$env:RUNNER_TEMP/lean-controlled-execution-b.zip").Hash) { throw 'Controlled-execution archives are not byte-identical' }
        if (git status --porcelain) { throw 'Controlled-execution validation changed the checkout' }
    - name: Verify prose preservation and packaged standalone instructions
      shell: pwsh
      run: ./scripts/test-prose-preservation.ps1 -ArtifactsDirectory ./artifacts/repro-a
