interface:
  display_name: Architecture
  short_description: Design durable boundaries and shared action contracts
  default_prompt: 'Use $architecture to design the smallest durable structure and interface contract for this change. Keep the global outcome-first, adaptive-prose, and considerate-agency overlays active: match reply weight to the task, report outcome, verification, and remaining action without routine process replay, and use heavier structure only when it improves understanding or action.'
