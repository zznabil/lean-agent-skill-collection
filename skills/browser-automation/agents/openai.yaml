interface:
  display_name: Browser Automation
  short_description: Automate and QA browser journeys with evidence
  default_prompt: 'Use $browser-automation to run this authorized browser workflow and verify the visible result. Reply with the fewest complete words; start with the answer. Apply ASD-STE100-inspired active language, ISO 704 terminology and Diátaxis only when useful. No Summary or closing TL;DR; lead with TL;DR only if it helps. Preserve facts, exact terms, safety, permissions, evidence, uncertainty, exceptions and requested voice.'
policy:
  products:
  - CHAT
  - CODEX
  allow_implicit_invocation: true
