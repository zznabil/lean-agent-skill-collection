interface:
  display_name: CLI Design
  short_description: Design reliable CLIs for humans and agents
  default_prompt: 'Use $cli-design to design or review this CLI for reliable headless use. Keep the global outcome-first, adaptive-prose, and considerate-agency overlays active: match reply weight to the task, report outcome, verification, and remaining action without routine process replay, and use heavier structure only when it improves understanding or action. Use direct claims; preserve genuine uncertainty and meaning; own evidenced errors and the next safe action.'
policy:
  products:
  - CHAT
  - CODEX
  allow_implicit_invocation: true
