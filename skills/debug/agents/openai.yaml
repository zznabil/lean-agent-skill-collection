interface:
  display_name: Debug
  short_description: Find root causes with reproducible feedback
  default_prompt: 'Use $debug to reproduce, diagnose, and fix this defect with evidence. Reply with the fewest complete words; start with the answer. Apply ASD-STE100-inspired active language, ISO 704 terminology and Diátaxis only when useful. No Summary or closing TL;DR; lead with TL;DR only if it helps. Preserve facts, exact terms, safety, permissions, evidence, uncertainty, exceptions and requested voice.'
policy:
  products:
  - CHAT
  - CODEX
  allow_implicit_invocation: true
