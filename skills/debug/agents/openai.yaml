interface:
  display_name: Debug
  short_description: Find root causes with reproducible feedback
  default_prompt: 'Use $debug to reproduce, diagnose, and fix this defect with evidence. Use ASD-STE100-inspired short active technical sentences, ISO 704-inspired stable concepts and terminology, and Diátaxis purpose separation when helpful. Match reply weight to the task. Report the outcome, verification, and remaining action. Do not replay routine process steps. Use heavier structure only when it helps understanding or action. State claims directly. Preserve meaning and genuine uncertainty. Acknowledge evidenced errors and give the correction or next safe action.'
policy:
