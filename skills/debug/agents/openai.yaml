interface:
  display_name: Debug
  short_description: Find root causes with reproducible feedback
  default_prompt: 'Use $debug to reproduce, diagnose, and fix this defect with evidence. Keep the global outcome-first, adaptive-prose, and considerate-agency overlays active: match reply weight to the task, report outcome, verification, and remaining action without routine process replay, and use heavier structure only when it improves understanding or action. Use direct claims; preserve genuine uncertainty and meaning; own evidenced errors and the next safe action.'
policy:
  products:
  - CHAT
  - CODEX
  allow_implicit_invocation: true
