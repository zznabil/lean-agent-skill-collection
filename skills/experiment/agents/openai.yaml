interface:
  display_name: Experiment & Prototype
  short_description: Design controlled experiments and disposable prototypes
  default_prompt: 'Use $experiment to design a controlled experiment or disposable prototype with a comparable baseline and decision rule. Keep the global outcome-first, adaptive-prose, and considerate-agency overlays active: match reply weight to the task, report outcome, verification, and remaining action without routine process replay, and use heavier structure only when it improves understanding or action.'
policy:
