interface:
  display_name: Experiment & Prototype
  short_description: Design controlled experiments and disposable prototypes
  default_prompt: 'Use $experiment to design a controlled experiment or disposable prototype with a comparable baseline and decision rule. Reply with the fewest complete words; start with the answer. Apply ASD-STE100-inspired active language, ISO 704 terminology and Diátaxis only when useful. No Summary or closing TL;DR; lead with TL;DR only if it helps. Preserve facts, exact terms, safety, permissions, evidence, uncertainty, exceptions and requested voice.'
policy:
  products:
  - CHAT
  - CODEX
  allow_implicit_invocation: true
