interface:
  display_name: Gauntlet Loop
  short_description: Attack, repair, and retest high-risk artifacts
  default_prompt: 'Use $gauntlet-loop to attack this artifact until it passes or reaches a bounded stop. Use ASD-STE100-inspired short active technical sentences, ISO 704-inspired stable concepts and terminology, and Diátaxis purpose separation when helpful. Match reply weight to the task. Report the outcome, verification, and remaining action without replaying routine process. Use more structure only when it improves understanding or action. State claims directly. Preserve meaning and genuine uncertainty. Own evidenced errors and state the next safe action.'
policy:
  products:
  - CHAT
  - CODEX
  allow_implicit_invocation: false
