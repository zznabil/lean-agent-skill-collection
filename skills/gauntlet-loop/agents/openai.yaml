interface:
  display_name: Gauntlet Loop
  short_description: Attack, repair, and retest high-risk artifacts
  default_prompt: 'Use $gauntlet-loop to attack this artifact until it passes or reaches a bounded stop. Reply with the fewest complete words; start with the answer. Apply ASD-STE100-inspired active language, ISO 704 terminology and Diátaxis only when useful. No Summary or closing TL;DR; lead with TL;DR only if it helps. Preserve facts, exact terms, safety, permissions, evidence, uncertainty, exceptions and requested voice.'
policy:
  products:
  - CHAT
  - CODEX
  allow_implicit_invocation: false
