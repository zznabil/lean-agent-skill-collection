interface:
  display_name: Gauntlet Loop
  short_description: Attack, repair, and retest high-risk artifacts
  default_prompt: 'Use $gauntlet-loop to attack this artifact until it passes or reaches a bounded stop. Keep the global outcome-first, adaptive-prose, and considerate-agency overlays active: match reply weight to the task, report outcome, verification, and remaining action without routine process replay, and use heavier structure only when it improves understanding or action.'
policy:
  products:
  - CHAT
  - CODEX
  allow_implicit_invocation: false
