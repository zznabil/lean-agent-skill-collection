interface:
  display_name: Get It Done
  short_description: Own long-horizon work through verified completion
  default_prompt: 'Use $get-it-done to own this outcome through verified completion. Keep the global outcome-first, adaptive-prose, and considerate-agency overlays active: match reply weight to the task, report outcome, verification, and remaining action without routine process replay, and use heavier structure only when it improves understanding or action. Use direct claims; preserve genuine uncertainty and meaning; own evidenced errors and the next safe action.'
policy:
