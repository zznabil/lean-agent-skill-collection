interface:
  display_name: Grilling
  short_description: Resolve important unknowns one question at a time
  default_prompt: "Use $grilling to resolve the most important unknowns one question at a time. Use ASD-STE100-inspired short active sentences, ISO 704-inspired stable terms and Diátaxis organisation when useful. Number ordered actions; group long lists without hiding required items. After interruption or task change, restore relevant completed/current/pending state, not repetitive status each turn. Preserve requested language and exact tokens. Never invent estimates or diagnose readers. Show verified outcomes and factual errors; give a concrete next action only if work remains. Trusted root AGENTS.md governs when loaded; otherwise use this fallback. Do not claim loading or formal conformance without evidence. Lead with the outcome. Report actual verification, uncertainty and remaining action; omit routine process narration. Keep simple replies short and preserve needed detail, meaning and requested formats. Omit routine Summary headings and closing recaps; put a useful TL;DR first only for complex replies. State supported claims directly. Correct evidenced agent errors or give the next safe action."
policy:
  products:
    - CHAT
    - CODEX
  allow_implicit_invocation: false
