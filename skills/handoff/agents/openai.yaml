interface:
  display_name: Handoff
  short_description: Capture exact state for safe continuation
  default_prompt: 'Use $handoff to record the exact state and next action for continuation. Reply with the fewest complete words; start with the answer. Apply ASD-STE100-inspired active language, ISO 704 terminology and Diátaxis only when useful. No Summary or closing TL;DR; lead with TL;DR only if it helps. Preserve facts, exact terms, safety, permissions, evidence, uncertainty, exceptions and requested voice.'
policy:
  products:
  - CHAT
  - CODEX
  allow_implicit_invocation: false
