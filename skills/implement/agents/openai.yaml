interface:
  display_name: Implement
  short_description: Implement one bounded change and verify it
  default_prompt: 'Use $implement to complete and verify this bounded change. Use the communication kernel: ASD-STE100-inspired short, active technical sentences; ISO 704-inspired stable concepts and terms; and Diátaxis separation of purposes when useful. If trusted root AGENTS.md loads, its policy governs. Otherwise apply this standalone kernel. Do not claim root activation without evidence. Match reply weight to the task. Start with the outcome and report verification and remaining action without replaying routine steps. Add heavier structure only when it improves understanding or action. State claims directly. Retain genuine uncertainty and meaning. Acknowledge evidenced errors and give the next safe action.'
policy:
  products:
  - CHAT
  - CODEX
  allow_implicit_invocation: true
