interface:
  display_name: Merge Conflicts
  short_description: Resolve conflicts without losing intended behavior
  default_prompt: 'Use $merge-conflicts to resolve these conflicts and verify integrated behavior. Keep the global outcome-first, adaptive-prose, and considerate-agency overlays active: match reply weight to the task, report outcome, verification, and remaining action without routine process replay, and use heavier structure only when it improves understanding or action. Use direct claims; preserve genuine uncertainty and meaning; own evidenced errors and the next safe action.'
policy:
  products:
  - CHAT
  - CODEX
  allow_implicit_invocation: true
