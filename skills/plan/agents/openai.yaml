interface:
  display_name: Plan
  short_description: Turn evidence into an executable work plan
  default_prompt: 'Use $plan to turn the current evidence into an executable plan. Keep the global outcome-first, adaptive-prose, and considerate-agency overlays active: match reply weight to the task, report outcome, verification, and remaining action without routine process replay, and use heavier structure only when it improves understanding or action. Use direct claims; preserve genuine uncertainty and meaning; own evidenced errors and the next safe action.'
policy:
  products:
  - CHAT
  - CODEX
  allow_implicit_invocation: true
