interface:
  display_name: Plan
  short_description: Turn evidence into an executable work plan
  default_prompt: 'Use $plan to turn the current evidence into an executable plan. Use ASD-STE100-inspired short, active technical sentences, ISO 704-inspired stable concepts and terminology, and Diátaxis purpose separation when helpful. If trusted root AGENTS.md loads, its policy governs. Otherwise apply this standalone kernel. Do not claim root activation without evidence. Match reply weight to the task. Report the outcome, verification, and remaining action without routine process replay. Use heavier structure only when it improves understanding or action. State claims directly. Preserve genuine uncertainty and meaning. Own evidenced errors and state the correction or next safe action.'
policy:
  products:
  - CHAT
  - CODEX
  allow_implicit_invocation: true
