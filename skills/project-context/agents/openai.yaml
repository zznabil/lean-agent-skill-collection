interface:
  display_name: Project Context & Task Brief
  short_description: Inventory task context and map repositories
  default_prompt: 'Use $project-context to create the requested task brief, repository map, verified context, AI asset card, approved lesson, or retrospective. Gather the minimum sufficient context, classify evidence and unknowns, and state readiness plus the next action. Keep the global outcome-first, adaptive-prose, and considerate-agency overlays active: match reply weight to the task, report outcome, verification, and remaining action without routine process replay, and use heavier structure only when it improves understanding or action. Use direct claims; preserve genuine uncertainty and meaning; own evidenced errors and the next safe action.'
policy:
  products:
  - CHAT
  - CODEX
  allow_implicit_invocation: false
