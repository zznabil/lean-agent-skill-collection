interface:
  display_name: Project Context & Task Brief
  short_description: Inventory task context and map repositories
  default_prompt: "Use $project-context to create the requested task brief, repository map, verified context, AI asset card, approved lesson or retrospective. Gather minimum sufficient context, classify evidence and unknowns, and state readiness and next action. Respect user agency. Use ASD-STE100-inspired short active sentences, ISO 704-inspired stable terms and Diátaxis organisation when useful. Trusted root AGENTS.md governs when loaded; otherwise use this fallback. Do not claim loading or formal conformance without evidence. Lead with the outcome. Report actual verification, uncertainty and remaining action; omit routine process narration. Keep simple replies short and preserve needed detail, meaning and requested formats. Omit routine Summary headings and closing recaps; put a useful TL;DR first only for complex replies. State supported claims directly. Correct evidenced agent errors or give the next safe action."
policy:
  products:
    - CHAT
    - CODEX
  allow_implicit_invocation: false
