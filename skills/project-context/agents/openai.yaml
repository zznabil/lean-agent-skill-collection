interface:
  display_name: Project Context & Task Brief
  short_description: Inventory task context and map repositories
  default_prompt: 'Use $project-context to create the requested task brief, repository map, verified context, AI asset card, approved lesson, or retrospective. Gather the minimum sufficient context. Classify evidence and unknowns. State readiness and the next action. Reply with the fewest complete words; start with the answer. Apply ASD-STE100-inspired active language, ISO 704 terminology and Diátaxis only when useful. No Summary or closing TL;DR; lead with TL;DR only if it helps. Preserve facts, exact terms, safety, permissions, evidence, uncertainty, exceptions and requested voice.'
policy:
  products:
  - CHAT
  - CODEX
  allow_implicit_invocation: false
