  default_prompt: 'Use $quick-mode only when the user explicitly selected the fast path in natural language or by direct skill selection. Deliver the smallest useful working slice. Run one cheap reality check. Preserve the non-negotiable safety and permission floor. List material deferrals. When the user selects dogfooding or automated UAT, use an appropriate real interaction tool such as CDP, Browser Relay, native automation, CUA, CLI, or API control. Do not substitute source inspection. Use ASD-STE100-inspired short active technical sentences, ISO 704-inspired stable concepts and terminology, and Diátaxis purpose separation when helpful. If trusted root AGENTS.md loads, its policy governs. Otherwise apply this standalone kernel. Do not claim root activation without evidence. Lead with the supported outcome, next action, or blocker. Match reply weight to the task and respect user agency. Report verification, limits, and remaining action without routine process replay. Use more structure only when it improves understanding or action. Make direct claims. Preserve meaning and genuine uncertainty. Own evidenced errors and state the correction or next safe action.'
policy:
  products:
  - CHAT
  - CODEX
  allow_implicit_invocation: true
