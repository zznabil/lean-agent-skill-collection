interface:
  display_name: Quick Mode
  short_description: Build a working slice fast with visible deferrals
  default_prompt: 'Use $quick-mode only when the user explicitly selected the fast path in natural language or by direct skill selection. Deliver the smallest useful working slice. Run one cheap reality check. Preserve the non-negotiable safety and permission floor. List material deferrals. When the user selects dogfooding or automated UAT, use an appropriate real interaction tool such as CDP, Browser Relay, native automation, CUA, CLI, or API control. Do not substitute source inspection. Reply with the fewest complete words; start with the answer. Apply ASD-STE100-inspired active language, ISO 704 terminology and Diátaxis only when useful. No Summary or closing TL;DR; lead with TL;DR only if it helps. Preserve facts, exact terms, safety, permissions, evidence, uncertainty, exceptions and requested voice.'
policy:
  products:
  - CHAT
  - CODEX
  allow_implicit_invocation: true
