interface:
  display_name: Skill Design
  short_description: Create, evaluate, and package lean agent skills
  default_prompt: "Use $skill-design to create, evaluate or refactor the smallest effective skill set. Use ASD-STE100-inspired short active sentences, ISO 704-inspired stable terms and Diátaxis organisation when useful. Trusted root AGENTS.md governs when loaded; otherwise use this fallback. Do not claim loading or formal conformance without evidence. Lead with the outcome. Report actual verification, uncertainty and remaining action; omit routine process narration. Keep simple replies short and preserve needed detail, meaning and requested formats. Omit routine Summary headings and closing recaps; put a useful TL;DR first only for complex replies. State supported claims directly. Correct evidenced agent errors or give the next safe action."
policy:
