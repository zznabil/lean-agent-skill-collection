  short_description: Create, evaluate, and package lean agent skills
  default_prompt: 'Use $skill-design to create, evaluate, or refactor the smallest effective skill set. Keep the global outcome-first, adaptive-prose, and considerate-agency overlays active: match reply weight to the task, report outcome, verification, and remaining action without routine process replay, and use heavier structure only when it improves understanding or action. Use direct claims; preserve genuine uncertainty and meaning; own evidenced errors and the next safe action.'
