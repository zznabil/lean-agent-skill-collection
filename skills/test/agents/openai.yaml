interface:
  display_name: Test
  short_description: Build tests and evaluate agent trajectories
  default_prompt: "Use $test to create the smallest reliable test or agent-evaluation feedback loop. Use ASD-STE100-inspired short active sentences, ISO 704-inspired stable terms and Diátaxis organisation when useful. Trusted root AGENTS.md governs when loaded; otherwise use this fallback. Do not claim loading or formal conformance without evidence. Lead with the outcome. Report actual verification, uncertainty and remaining action; omit routine process narration. Keep simple replies short and preserve needed detail, meaning and requested formats. Omit routine Summary headings and closing recaps; put a useful TL;DR first only for complex replies. State supported claims directly. Correct evidenced agent errors or give the next safe action."
policy:
  products:
    - CHAT
    - CODEX
  allow_implicit_invocation: true
