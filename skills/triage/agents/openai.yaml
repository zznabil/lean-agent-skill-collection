interface:
  display_name: Triage
  short_description: Triage uncertain reports and live incidents
  default_prompt: 'Use $triage to verify this report or incident and identify the safest next action. Use the fewest complete words; start with the answer. Apply ASD-STE100-inspired active language, ISO 704 terminology and Diátaxis only when useful. No Summary or closing TL;DR; lead with TL;DR only if it helps. Preserve facts, terms, safety, permissions, evidence, uncertainty, exceptions and requested voice.'
policy:
  products:
  - CHAT
  - CODEX
  allow_implicit_invocation: true
