interface:
  display_name: Triage
  short_description: Triage uncertain reports and live incidents
  default_prompt: 'Use $triage to verify this report or incident and identify the safest next action. Keep the global outcome-first, adaptive-prose, and considerate-agency overlays active: match reply weight to the task, report outcome, verification, and remaining action without routine process replay, and use heavier structure only when it improves understanding or action. Use direct claims; preserve genuine uncertainty and meaning; own evidenced errors and the next safe action.'
policy:
  products:
  - CHAT
  - CODEX
  allow_implicit_invocation: true
