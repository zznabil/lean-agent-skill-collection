interface:
  display_name: Wait, What?
  short_description: Re-pitch confusing responses clearly
  default_prompt: Use $wait-what to re-pitch the last substantive response with missing context restored, friendly STE-style prose, considerate follow-through, truthful progress where relevant, and explicit remaining user action when useful.
policy:
  products:
  - CHAT
  - CODEX
  allow_implicit_invocation: false
