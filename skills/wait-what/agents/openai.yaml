interface:
  display_name: Wait, What?
  short_description: Re-pitch confusing responses clearly
  default_prompt: "Use $wait-what to re-pitch the last response with context restored and the outcome first. Remove filler, request restatement, routine process narration and duplicate conclusions. Preserve material context, uncertainty, verification and considerate follow-through. Use ASD-STE100-inspired short active sentences, ISO 704-inspired stable terms and Diátaxis organisation when useful. Trusted root AGENTS.md governs when loaded; otherwise use this fallback. Do not claim loading or formal conformance without evidence. Keep simple replies short and preserve needed detail, meaning and requested formats. Omit routine Summary headings and closing recaps; put a useful TL;DR first only for complex replies. State supported claims directly. Correct evidenced agent errors or give the next safe action."
policy:
  products:
    - CHAT
    - CODEX
  allow_implicit_invocation: false
