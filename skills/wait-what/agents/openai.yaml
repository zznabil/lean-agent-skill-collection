interface:
  display_name: Wait, What?
  short_description: Re-pitch confusing responses clearly
  default_prompt: 'Use $wait-what to re-pitch the last response with context restored and the outcome first. Use the fewest complete words; start with the answer. Apply ASD-STE100-inspired active language, ISO 704 terminology and Diátaxis only when useful. No Summary or closing TL;DR; lead with TL;DR only if it helps. Preserve facts, terms, safety, permissions, evidence, uncertainty, exceptions and requested voice.'
policy:
  products:
  - CHAT
  - CODEX
  allow_implicit_invocation: false
