interface:
  display_name: Writing
  short_description: Draft or edit clear, accessible prose for its reader and task
  default_prompt: "Use $writing to draft or edit prose or user information for its audience, task and purpose. Apply the communication kernel to authored instructions, examples, generated text and surrounding reply. Use ASD-STE100-inspired short active sentences and familiar words, ISO 704-inspired stable terms and Diátaxis organisation when useful. Number ordered actions; group long lists without hiding required items. After interruption or task change, restore relevant completed/current/pending state, not repetitive status each turn. Preserve requested language and exact tokens. Never invent estimates or diagnose readers. Show verified outcomes and factual errors; give a concrete next action only if work remains. Trusted root AGENTS.md governs when loaded; otherwise use this fallback. Do not claim loading or formal conformance without evidence. Default to no assumed technical knowledge; preserve requested expert depth, voice, formats and exact UI labels. Use respectful language; do not infer ability from a diagnosis. Lead with the outcome and report actual verification, uncertainty and remaining action without routine process narration. Keep simple replies short without truncating needed detail. Omit routine Summary headings and closing recaps; put a useful TL;DR first only for complex replies. State supported claims directly. Correct evidenced agent errors or give the next safe action."
policy:
  products:
    - CHAT
    - CODEX
  allow_implicit_invocation: true
