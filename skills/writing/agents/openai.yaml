interface:
  display_name: Writing
  short_description: Draft or edit clear prose and user information for its task
  default_prompt: 'Use $writing to draft or edit this prose or user information for its audience, task, and purpose. Keep the global outcome-first, adaptive-prose, and considerate-agency overlays active: match reply weight to the task, report outcome, verification, and remaining action without routine process replay, and use heavier structure only when it improves understanding or action. Use direct claims; preserve genuine uncertainty and meaning; own evidenced errors and the next safe action.'
policy:
  products:
  - CHAT
  - CODEX
  allow_implicit_invocation: true
