interface:
  display_name: Writing
  short_description: Draft or edit clear prose and user information for its task
  default_prompt: 'Use $writing to draft or edit this prose or user information for its audience, task, and purpose. Use the fewest complete words; start with the answer. Apply ASD-STE100-inspired active language, ISO 704 terminology and Diátaxis only when useful. No Summary or closing TL;DR; lead with TL;DR only if it helps. Preserve facts, terms, safety, permissions, evidence, uncertainty, exceptions and requested voice. Use familiar language for non-technical readers, respect accessibility needs, and preserve requested expert depth and exact UI labels.'
policy:
  products:
  - CHAT
  - CODEX
  allow_implicit_invocation: true
