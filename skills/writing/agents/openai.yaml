interface:
  display_name: Writing
  short_description: Draft or edit clear, accessible prose for its reader and task
  default_prompt: 'Use $writing to draft or edit this prose or user information for its audience, task, and purpose. Apply the communication kernel to authored instructions, examples, generated text, and the surrounding reply. Use ASD-STE100-inspired short active sentences and familiar words, ISO 704-inspired stable terminology, and Diátaxis organization when helpful. Default to no assumed technical knowledge; preserve requested expert depth, voice, formats, and exact UI labels. Use respectful language and do not infer ability from a diagnosis. Match reply weight to the task. Report the outcome, verification, and remaining action without routine process replay. Use heavier structure only when it improves understanding or action. Make direct claims. Preserve genuine uncertainty and meaning. Own evidenced errors and state the next safe action.'
policy:
  products:
  - CHAT
  - CODEX
  allow_implicit_invocation: true
